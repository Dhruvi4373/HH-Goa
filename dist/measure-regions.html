<!DOCTYPE html>
<html>
<head>
<title>Template Region Measurement Tool</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a1a; color: #eee; font-family: monospace; overflow: auto; }
  #info { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #222; padding: 8px 16px; font-size: 13px; border-bottom: 2px solid #555; }
  #info span { margin-right: 20px; }
  #canvas-wrap { margin-top: 50px; position: relative; display: inline-block; }
  canvas { display: block; cursor: crosshair; }
  #regions-output { position: fixed; right: 0; top: 50px; bottom: 0; width: 420px; background: #111; border-left: 2px solid #555; padding: 12px; overflow-y: auto; font-size: 12px; z-index: 100; }
  #regions-output pre { white-space: pre-wrap; }
  .region-item { margin-bottom: 8px; padding: 6px; border: 1px solid #444; border-radius: 4px; }
  .region-item .name { font-weight: bold; color: #0f0; }
  .btn { padding: 4px 10px; margin: 2px; cursor: pointer; background: #333; color: #eee; border: 1px solid #666; border-radius: 3px; font-family: monospace; font-size: 12px; }
  .btn:hover { background: #555; }
  .btn.active { background: #060; border-color: #0f0; }
  #pixel-color { display: inline-block; width: 16px; height: 16px; border: 1px solid #fff; vertical-align: middle; }
</style>
</head>
<body>

<div id="info">
  <span>Pos: <b id="pos">-</b></span>
  <span>Color: <span id="pixel-color"></span> <b id="color-val">-</b></span>
  <span>Drawing: <b id="draw-field">-</b></span>
  <span>Rect: <b id="rect-info">-</b></span>
</div>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
</div>

<div id="regions-output">
  <h3 style="margin-bottom:8px;">Region Measurement</h3>
  <p style="color:#aaa;margin-bottom:8px;">Select field, then click+drag on template to define region.</p>
  
  <div style="margin-bottom:12px;">
    <b>Select field:</b><br>
    <button class="btn" data-field="rider">RIDER</button>
    <button class="btn" data-field="stack">STACK</button>
    <button class="btn" data-field="builderClass">CLASS</button>
    <button class="btn" data-field="team">TEAM</button>
    <button class="btn" data-field="status">STATUS</button>
    <button class="btn" data-field="photoWindow">PHOTO</button>
    <button class="btn" data-field="builderId">BUILDER ID</button>
  </div>
  
  <div style="margin-bottom:12px;">
    <button class="btn" onclick="clearAll()">Clear All</button>
    <button class="btn" onclick="exportLayout()">Export JSON</button>
    <button class="btn" onclick="renderDebug()">Render Debug Overlay</button>
  </div>
  
  <div id="measured-regions"></div>
  <pre id="json-output" style="margin-top:12px; color:#0f0; background:#000; padding:8px; border-radius:4px;"></pre>
</div>

<script>
const FIELD_COLORS = {
  rider: 'rgba(255, 0, 0, 0.35)',
  stack: 'rgba(0, 100, 255, 0.35)',
  builderClass: 'rgba(255, 0, 255, 0.35)',
  team: 'rgba(0, 200, 0, 0.35)',
  status: 'rgba(255, 255, 0, 0.35)',
  photoWindow: 'rgba(0, 255, 255, 0.35)',
  builderId: 'rgba(255, 165, 0, 0.35)'
};

const FIELD_STROKE = {
  rider: 'red',
  stack: 'blue',
  builderClass: 'magenta',
  team: 'green',
  status: 'yellow',
  photoWindow: 'cyan',
  builderId: 'orange'
};

let canvas, ctx, img, imageData;
let currentField = null;
let isDrawing = false;
let startX = 0, startY = 0;
let regions = {};

const posEl = document.getElementById('pos');
const colorVal = document.getElementById('color-val');
const pixelColor = document.getElementById('pixel-color');
const drawField = document.getElementById('draw-field');
const rectInfo = document.getElementById('rect-info');

// Load template
window.onload = function() {
  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d');
  
  img = new Image();
  img.onload = function() {
    canvas.width = img.width;
    canvas.height = img.height;
    console.log(`Template loaded: ${img.width} x ${img.height}`);
    ctx.drawImage(img, 0, 0);
    imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  };
  img.src = '/assets/final-builder-id-template.png';
};

// Field selection buttons
document.querySelectorAll('[data-field]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-field]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentField = btn.dataset.field;
    drawField.textContent = currentField;
  });
});

// Mouse tracking for pixel info
canvas?.parentElement?.addEventListener('mousemove', handleMove);
document.getElementById('canvas-wrap').addEventListener('mousemove', handleMove);

function handleMove(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = Math.floor((e.clientX - rect.left) * scaleX);
  const y = Math.floor((e.clientY - rect.top) * scaleY);
  
  if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height) {
    posEl.textContent = `${x}, ${y}`;
    
    if (imageData) {
      const idx = (y * canvas.width + x) * 4;
      const r = imageData.data[idx];
      const g = imageData.data[idx + 1];
      const b = imageData.data[idx + 2];
      const hex = `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
      colorVal.textContent = `rgb(${r},${g},${b}) ${hex}`;
      pixelColor.style.background = hex;
    }
  }
  
  if (isDrawing) {
    const rect2 = canvas.getBoundingClientRect();
    const scaleX2 = canvas.width / rect2.width;
    const scaleY2 = canvas.height / rect2.height;
    const curX = Math.floor((e.clientX - rect2.left) * scaleX2);
    const curY = Math.floor((e.clientY - rect2.top) * scaleY2);
    
    const rx = Math.min(startX, curX);
    const ry = Math.min(startY, curY);
    const rw = Math.abs(curX - startX);
    const rh = Math.abs(curY - startY);
    
    rectInfo.textContent = `x:${rx} y:${ry} w:${rw} h:${rh}`;
    
    // Redraw
    redraw();
    ctx.strokeStyle = FIELD_STROKE[currentField] || '#fff';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 3]);
    ctx.strokeRect(rx, ry, rw, rh);
    ctx.setLineDash([]);
  }
}

// Mouse down/up for drawing
document.getElementById('canvas-wrap').addEventListener('mousedown', function(e) {
  if (!currentField) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  startX = Math.floor((e.clientX - rect.left) * scaleX);
  startY = Math.floor((e.clientY - rect.top) * scaleY);
  isDrawing = true;
});

document.addEventListener('mouseup', function(e) {
  if (!isDrawing || !currentField) return;
  isDrawing = false;
  
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const endX = Math.floor((e.clientX - rect.left) * scaleX);
  const endY = Math.floor((e.clientY - rect.top) * scaleY);
  
  const rx = Math.min(startX, endX);
  const ry = Math.min(startY, endY);
  const rw = Math.abs(endX - startX);
  const rh = Math.abs(endY - startY);
  
  if (rw > 5 && rh > 5) {
    regions[currentField] = { x: rx, y: ry, width: rw, height: rh };
    updateRegionsList();
    redraw();
  }
});

function redraw() {
  ctx.drawImage(img, 0, 0);
  
  // Draw all saved regions
  for (const [field, r] of Object.entries(regions)) {
    ctx.fillStyle = FIELD_COLORS[field];
    ctx.fillRect(r.x, r.y, r.width, r.height);
    ctx.strokeStyle = FIELD_STROKE[field];
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x, r.y, r.width, r.height);
    
    // Label
    ctx.fillStyle = '#000';
    ctx.font = 'bold 14px monospace';
    ctx.fillText(`${field.toUpperCase()} (${r.x},${r.y}) ${r.width}x${r.height}`, r.x + 4, r.y - 4);
  }
}

function updateRegionsList() {
  const container = document.getElementById('measured-regions');
  container.innerHTML = '';
  for (const [field, r] of Object.entries(regions)) {
    const div = document.createElement('div');
    div.className = 'region-item';
    div.innerHTML = `<span class="name" style="color:${FIELD_STROKE[field]}">${field}</span>: x=${r.x} y=${r.y} w=${r.width} h=${r.height}`;
    container.appendChild(div);
  }
}

function clearAll() {
  regions = {};
  updateRegionsList();
  if (img.complete) {
    ctx.drawImage(img, 0, 0);
    imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  }
}

function exportLayout() {
  const output = document.getElementById('json-output');
  output.textContent = JSON.stringify(regions, null, 2);
}

function renderDebug() {
  redraw();
}
</script>
</body>
</html>
