<!DOCTYPE html>
<html>
<head>
<title>Template Coordinate Measurer</title>
<style>
body { margin: 0; background: #333; overflow: auto; }
#container { position: relative; display: inline-block; }
#container img { display: block; }
#info { 
  position: fixed; top: 10px; left: 10px; z-index: 999; 
  background: rgba(0,0,0,0.85); color: #0f0; padding: 12px; 
  font: 14px monospace; border-radius: 6px; pointer-events: none;
}
#crosshair-h, #crosshair-v {
  position: absolute; pointer-events: none; z-index: 100;
}
#crosshair-h { left: 0; right: 0; height: 1px; background: rgba(255,0,0,0.5); }
#crosshair-v { top: 0; bottom: 0; width: 1px; background: rgba(255,0,0,0.5); }
.marker { 
  position: absolute; width: 6px; height: 6px; background: red; border-radius: 50%; 
  transform: translate(-3px, -3px); z-index: 101; pointer-events: none;
}
.marker-label {
  position: absolute; color: yellow; font: 11px monospace; 
  transform: translate(8px, -6px); z-index: 101; pointer-events: none;
  text-shadow: 1px 1px 2px black;
}
#log { 
  position: fixed; bottom: 10px; left: 10px; z-index: 999;
  background: rgba(0,0,0,0.85); color: #ff0; padding: 12px;
  font: 12px monospace; border-radius: 6px; max-height: 300px; overflow-y: auto;
  min-width: 400px;
}
</style>
</head>
<body>
<div id="info">Move mouse over template. Click to mark points. Press 'C' to clear markers.</div>
<div id="log">Markers log:<br></div>
<div id="container">
  <img id="tmpl" src="assets/final-builder-id-template.png" />
  <div id="crosshair-h"></div>
  <div id="crosshair-v"></div>
</div>
<script>
const img = document.getElementById('tmpl');
const info = document.getElementById('info');
const logDiv = document.getElementById('log');
const ch = document.getElementById('crosshair-h');
const cv = document.getElementById('crosshair-v');
const container = document.getElementById('container');
let markers = [];
let markerCount = 0;

container.addEventListener('mousemove', (e) => {
  const rect = img.getBoundingClientRect();
  const x = Math.round(e.clientX - rect.left);
  const y = Math.round(e.clientY - rect.top);
  info.textContent = `x: ${x}  y: ${y}  (template: 1535×1024)`;
  ch.style.top = (e.clientY - rect.top) + 'px';
  cv.style.left = (e.clientX - rect.left) + 'px';
});

container.addEventListener('click', (e) => {
  const rect = img.getBoundingClientRect();
  const x = Math.round(e.clientX - rect.left);
  const y = Math.round(e.clientY - rect.top);
  markerCount++;
  
  const marker = document.createElement('div');
  marker.className = 'marker';
  marker.style.left = x + 'px';
  marker.style.top = y + 'px';
  container.appendChild(marker);
  
  const label = document.createElement('div');
  label.className = 'marker-label';
  label.style.left = x + 'px';
  label.style.top = y + 'px';
  label.textContent = `#${markerCount} (${x}, ${y})`;
  container.appendChild(label);
  
  logDiv.innerHTML += `Point #${markerCount}: x=${x}, y=${y}<br>`;
  logDiv.scrollTop = logDiv.scrollHeight;
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'c' || e.key === 'C') {
    document.querySelectorAll('.marker, .marker-label').forEach(el => el.remove());
    markerCount = 0;
    logDiv.innerHTML = 'Markers log (cleared):<br>';
  }
});
</script>
</body>
</html>
